[project]
name = "ats-checker"
version = "0.1.0"
description = "ATS checker: analiza la compatibilidad de un CV con una oferta usando LangGraph, Claude y Streamlit"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.4.0",
    "langgraph>=1.2.0",
    "streamlit>=1.63.0",
    "pydantic>=2.9",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "pandas>=2.2",
    "typing-extensions>=4.12",
    "python-dotenv>=1.0",
    "openai>=3.11.0",
    "google-genai>=2.22.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# Es una aplicación, no una librería instalable.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
